services:
  - type: web
    name: playbook-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: RENDER_API_KEY
        sync: false
      - key: PLAYBOOK_WORKFLOW_SLUG
        sync: false
      - key: INGEST_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
